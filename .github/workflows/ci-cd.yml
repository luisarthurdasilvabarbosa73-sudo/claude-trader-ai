# CLAUDE TRADER AI — automação no GitHub (tudo pelo navegador).
# A cada envio: testa o motor Python (referência), testa o motor do app, confere se os dois
# decidem igual (paridade), compila o app e publica no GitHub Pages.
# Manualmente (Actions > Run workflow > backtest): backtest com dados históricos reais.
name: CLAUDE TRADER AI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tarefa:
        description: "O que executar"
        type: choice
        options: [publicar, backtest]
        default: publicar
      simbolos:
        description: "Pares para o backtest"
        default: "SOLUSDT,XRPUSDT,ADAUSDT"
      inicio:
        description: "Início do backtest (AAAA-MM-DD)"
        default: "2026-08-01"
      fim:
        description: "Fim do backtest (AAAA-MM-DD)"
        default: "2026-10-31"
      capital:
        description: "Capital inicial em R$"
        default: "30"

permissions:
  contents: read

concurrency:
  group: cta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes-python:
    if: ${{ inputs.tarefa != 'backtest' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - name: Testes do motor de referência (Python)
        working-directory: backend
        run: python -m pytest -q -rs

  app:
    if: ${{ inputs.tarefa != 'backtest' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Gerar dados de paridade com o motor Python
        run: |
          pip install -r backend/requirements.txt
          python backend/scripts/gerar_paridade.py /tmp/paridade.json
      - name: Instalar dependências do app
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Testes do motor do app + paridade com o Python
        working-directory: frontend
        env:
          PARIDADE: /tmp/paridade.json
        run: npm test
      - name: Verificar tipos e compilar o app
        working-directory: frontend
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  publicar:
    needs: [testes-python, app]
    if: ${{ github.ref == 'refs/heads/main' && inputs.tarefa != 'backtest' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  backtest:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.tarefa == 'backtest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Backtest com dados históricos reais da Binance
        working-directory: backend
        run: |
          python scripts/backtest.py --symbols "${{ inputs.simbolos }}" --start "${{ inputs.inicio }}" --end "${{ inputs.fim }}" --capital-brl "${{ inputs.capital }}"
          cat reports/*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-backtest
          path: backend/reports/
